<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AI Personeelstraining banner</title>
  <desc id="desc">Advertentiebanner voor AI Personeelstraining: laat AI echt werken in je bedrijf.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="0.56" stop-color="#111827"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6ee7b7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="168" cy="84" r="150" fill="url(#glowA)"/>
  <circle cx="1030" cy="276" r="190" fill="url(#glowB)"/>

  <g opacity="0.18" stroke="#7dd3fc" stroke-width="1">
    <path d="M772 58h190M772 92h252M772 126h156"/>
    <path d="M912 238h190M912 272h148M912 306h222"/>
  </g>

  <g transform="translate(70 60)">
    <rect x="0" y="0" width="130" height="42" rx="21" fill="#ecfeff" opacity="0.12" stroke="#6ee7b7" stroke-opacity="0.55"/>
    <text x="20" y="27" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.4" fill="#6ee7b7">AI TRAINING</text>

    <text x="0" y="104" font-family="Inter, Arial, sans-serif" font-size="52" line-height="1.05" font-weight="850" fill="#ffffff">
      Laat AI echt werken
    </text>
    <text x="0" y="160" font-family="Inter, Arial, sans-serif" font-size="52" line-height="1.05" font-weight="850" fill="#ffffff">
      in je bedrijf
    </text>

    <text x="0" y="208" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">
      Praktische trainingen in ChatGPT, Claude, Mistral, Codex,
    </text>
    <text x="0" y="238" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">
      NotebookLM en slimme workflowautomatisering.
    </text>

    <g transform="translate(0 264)">
      <rect width="252" height="52" rx="26" fill="url(#accent)"/>
      <text x="28" y="34" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="850" fill="#07111f">Ontdek AI Personeelstraining</text>
    </g>
  </g>

  <g transform="translate(810 72)" filter="url(#shadow)">
    <rect x="0" y="0" width="290" height="228" rx="24" fill="#f8fafc"/>
    <rect x="26" y="28" width="96" height="14" rx="7" fill="#10b981"/>
    <rect x="26" y="58" width="220" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="26" y="82" width="172" height="12" rx="6" fill="#e2e8f0"/>
    <g transform="translate(28 122)">
      <rect width="42" height="42" rx="10" fill="#111827"/>
      <rect x="12" y="12" width="8" height="8" fill="#f8fafc"/>
      <rect x="24" y="12" width="8" height="8" fill="#f8fafc"/>
      <rect x="12" y="24" width="8" height="8" fill="#f8fafc"/>
      <rect x="24" y="24" width="8" height="8" fill="#6ee7b7"/>
    </g>
    <path d="M96 144h120" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
    <path d="M96 170h84" stroke="#7dd3fc" stroke-width="10" stroke-linecap="round"/>
    <rect x="26" y="198" width="238" height="1" fill="#e2e8f0"/>
  </g>

  <g transform="translate(740 252)">
    <rect width="144" height="44" rx="22" fill="#ffffff" opacity="0.12" stroke="#6ee7b7" stroke-opacity="0.45"/>
    <text x="20" y="28" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="750" fill="#d1fae5">tools bouwen</text>
  </g>
  <g transform="translate(902 252)">
    <rect width="164" height="44" rx="22" fill="#ffffff" opacity="0.12" stroke="#7dd3fc" stroke-opacity="0.45"/>
    <text x="20" y="28" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="750" fill="#e0f2fe">mensen trainen</text>
  </g>
</svg>
