<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">QR Studio free QR code promise</title>
  <desc id="desc">Infographic explaining that QR Studio creates free, direct and reliable QR codes with no account, no hidden costs, no redirects and no scan limits.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#11151f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .muted { fill: #8b95a7; }
      .text { fill: #e7ecf4; }
      .dark { fill: #0f172a; }
      .card { fill: rgba(17,21,31,0.92); stroke: rgba(110,231,183,0.24); stroke-width: 2; }
      .pill { fill: rgba(110,231,183,0.12); stroke: rgba(110,231,183,0.38); stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="86" cy="74" r="230" fill="#6ee7b7" opacity="0.12"/>
  <circle cx="1110" cy="662" r="280" fill="#7dd3fc" opacity="0.10"/>

  <g filter="url(#shadow)">
    <rect x="70" y="64" width="1060" height="592" rx="34" class="card"/>
  </g>

  <g transform="translate(110 104)">
    <rect x="0" y="0" width="300" height="52" rx="26" class="pill"/>
    <text x="28" y="34" class="sans" font-size="20" font-weight="800" fill="#6ee7b7" letter-spacing="2">FREE, DIRECT, RELIABLE</text>

    <text x="0" y="130" class="sans text" font-size="64" font-weight="850">QR Studio promise</text>
    <text x="0" y="178" class="sans muted" font-size="28">Plain static QR codes. No tricks. No subscription trap.</text>
  </g>

  <g transform="translate(110 338)">
    <g>
      <rect x="0" y="0" width="235" height="170" rx="24" fill="#111827" stroke="#1c2230" stroke-width="2"/>
      <circle cx="42" cy="46" r="16" fill="url(#accent)"/>
      <text x="28" y="92" class="sans text" font-size="26" font-weight="800">No account</text>
      <text x="28" y="126" class="sans muted" font-size="18">Create QR codes</text>
      <text x="28" y="150" class="sans muted" font-size="18">without signing up.</text>
    </g>
    <g transform="translate(265 0)">
      <rect x="0" y="0" width="235" height="170" rx="24" fill="#111827" stroke="#1c2230" stroke-width="2"/>
      <circle cx="42" cy="46" r="16" fill="url(#accent)"/>
      <text x="28" y="92" class="sans text" font-size="26" font-weight="800">No hidden costs</text>
      <text x="28" y="126" class="sans muted" font-size="18">No paywall after</text>
      <text x="28" y="150" class="sans muted" font-size="18">you download.</text>
    </g>
    <g transform="translate(530 0)">
      <rect x="0" y="0" width="235" height="170" rx="24" fill="#111827" stroke="#1c2230" stroke-width="2"/>
      <circle cx="42" cy="46" r="16" fill="url(#accent)"/>
      <text x="28" y="92" class="sans text" font-size="26" font-weight="800">No redirects</text>
      <text x="28" y="126" class="sans muted" font-size="18">Scans go directly</text>
      <text x="28" y="150" class="sans muted" font-size="18">to your destination.</text>
    </g>
    <g transform="translate(795 0)">
      <rect x="0" y="0" width="235" height="170" rx="24" fill="#111827" stroke="#1c2230" stroke-width="2"/>
      <circle cx="42" cy="46" r="16" fill="url(#accent)"/>
      <text x="28" y="92" class="sans text" font-size="26" font-weight="800">No scan limits</text>
      <text x="28" y="126" class="sans muted" font-size="18">Static codes keep</text>
      <text x="28" y="150" class="sans muted" font-size="18">working.</text>
    </g>
  </g>

  <g transform="translate(110 570)">
    <rect x="0" y="0" width="660" height="48" rx="24" fill="url(#accent)"/>
    <text x="28" y="32" class="sans dark" font-size="20" font-weight="850">Built as a practical workflow automation example by AI Personeelstraining</text>
  </g>

  <g transform="translate(850 96)">
    <rect x="0" y="0" width="205" height="205" rx="28" fill="#ffffff"/>
    <g fill="#111827">
      <rect x="28" y="28" width="50" height="50" rx="8"/>
      <rect x="128" y="28" width="50" height="50" rx="8"/>
      <rect x="28" y="128" width="50" height="50" rx="8"/>
      <rect x="92" y="28" width="20" height="20" rx="4"/>
      <rect x="92" y="64" width="20" height="20" rx="4"/>
      <rect x="128" y="92" width="20" height="20" rx="4"/>
      <rect x="164" y="92" width="20" height="20" rx="4"/>
      <rect x="92" y="128" width="20" height="20" rx="4"/>
      <rect x="128" y="128" width="50" height="20" rx="4"/>
      <rect x="128" y="164" width="20" height="20" rx="4"/>
      <rect x="164" y="164" width="20" height="20" rx="4"/>
    </g>
  </g>
</svg>
